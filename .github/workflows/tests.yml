name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # No AGENT_MISSION_I_AM_HUMAN here, deliberately: the suite passed for
      # days only because every local run exported it, and that variable's
      # whole job is to switch off the gate most of these tests exist to guard.
      - run: python -m pytest -q
